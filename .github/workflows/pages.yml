name: Build va GitHub Pages ga joylash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apps Script manzilini qoʻyish)
        env:
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
        run: |
          SCRIPT_URL="$(printf '%s' "$SCRIPT_URL" | tr -d '[:space:]')"   # nusxalashda qoʻshilgan boʻsh joy/yangi qatorlarni olib tashlash
          if [[ ! "$SCRIPT_URL" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]]; then
            echo "::error::SCRIPT_URL notoʻgʻri yoki kiritilmagan (Settings → Secrets and variables → Actions → Variables). Kutilgan koʻrinish: https://script.google.com/macros/s/.../exec"
            exit 1
          fi
          mkdir -p dist
          html="$(cat index.html)"
          printf '%s\n' "${html//__SCRIPT_URL__/$SCRIPT_URL}" > dist/index.html
          if grep -q "__SCRIPT_URL__" dist/index.html; then echo "::error::Almashtirish bajarilmadi"; exit 1; fi
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
